# CI (v1.1 R7): clean install, both typechecks and the test suite on every
# supported OS × Node; the browser/desktop serial group; the VS Code E2E under
# Xvfb; and a smoke test of the exact artefacts we distribute (the npm tarball
# and the .vsix), installed from the files themselves on each OS.
#
# Local equivalents (docs/TESTING.md): npm ci && npm run typecheck && npm test;
# npm run test:serial; node scripts/smoke-artefacts.mjs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests that need pytest skip without it locally; in CI it is installed, so a missing one must fail.
  TUG_REQUIRE_PYTEST: '1'
  FORCE_COLOR: '0'

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python test deps (the eval and benchmark fixtures score with pytest; config tasks read YAML)
        run: python -m pip install pytest pyyaml

      - name: Language servers for the N46 LSP fixtures (pyright, gopls)
        shell: bash
        run: |
          python -m pip install pyright
          if command -v go >/dev/null; then go install golang.org/x/tools/gopls@v0.20.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"; fi

      - name: Clean install (core and extension)
        run: |
          npm ci
          npm ci --prefix vscode

      - name: Typecheck core
        run: npm run typecheck

      - name: Typecheck extension
        run: node node_modules/typescript/bin/tsc -p vscode/tsconfig.json

      - name: Install the Playwright browser (CI only)
        run: npx playwright install --with-deps chromium

      - name: OS sandbox for the C2/R1 tests (Linux)
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev -- /bin/true
          echo "TUG_REQUIRE_BWRAP=1" >> "$GITHUB_ENV"

      - name: VS Code for the vscode-host conformance driver (one download, before the parallel tests)
        # Several test files start the extension host at once; without a cached VS Code they all downloaded
        # and unzipped it into the same folder concurrently ("Failed to unzip archive", ENOTEMPTY).
        if: runner.os == 'Linux'
        working-directory: vscode
        run: |
          node -e "require('@vscode/test-electron').downloadAndUnzipVSCode({ version: 'stable', cachePath: '.vscode-test' }).then((p) => console.log(p))"
          npm run build   # built once here; otherwise each parallel test file rebuilt the same dist/ at the same time

      - name: Test (parallel group)
        # The suite drives bash, POSIX tools and Unix process groups, and its sandbox tests assume Linux
        # (bwrap). On Windows and macOS it runs for information until the platform ports and the macOS
        # device checks are done (scripts/device-checks), so it does not block the matrix.
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        run: npm test -- --parallel

  docs:
    # WS12: docs-as-code. Broken links/anchors, stale path and symbol references, `tug …` flags that
    # `tug <sub> --help` no longer lists, and snippets that do not parse. No model, no network.
    name: docs check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: tug docs check
        run: npx tsx src/cli/main.ts docs check --format github --cli "npx tsx src/cli/main.ts"

  browser-desktop:
    name: browser + desktop serial group (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Linux user namespaces for bwrap and Chromium's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor: bwrap (command sandbox) and
        # Chromium/Electron (browser, VS Code) need them, or they crash or hang.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev -- /bin/true

      - name: Install the Playwright browser (CI only)
        run: npx playwright install --with-deps chromium

      - name: OCR engine (desktop perception tests)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tesseract-ocr xvfb; else brew install tesseract; fi

      - name: Serial group (real browsers, desktop, kill switches)
        # macOS runs for information until the macOS device checks are done
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
        run: npm run test:serial

      - name: No test browser left running
        if: always()
        run: |
          if ps -A -ww -o pid=,ppid=,args= | grep -E 'oh-electron-test|oh-cdp-|ms-playwright' | grep -v grep; then
            echo "::error title=Leaked browser::processes from the test run are still alive"
            exit 1
          fi

  vscode-e2e:
    name: VS Code E2E (ubuntu, Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json

      - name: Clean install
        run: |
          npm ci
          npm ci --prefix vscode

      - name: Desktop libraries for Electron (VS Code)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install-deps chromium

      - name: Build the extension
        run: npm run vscode:build

      - name: Linux user namespaces for bwrap and Chromium's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor: bwrap (command sandbox) and
        # Chromium/Electron (browser, VS Code) need them, or they crash or hang.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev -- /bin/true

      - name: E2E under Xvfb
        working-directory: vscode
        shell: bash
        # A scenario that drives VS Code's own terminal can miss shell-integration events on a loaded runner. Up to
        # three failed scenarios are run once more, by name, with a warning; more than that fails the job.
        run: |
          set -o pipefail
          note() { grep -h '^\[e2e\] note:' e2e*.log 2>/dev/null | sed 's/^/::warning::/' || true; }
          if xvfb-run -a node test/runTest.mjs 2>&1 | tee e2e.log; then note; exit 0; fi
          failed=$(grep -oP '^\[e2e\] ✗ \K[^:]+' e2e.log | sort -u)
          n=$(printf '%s\n' "$failed" | grep -c . || true)
          if [ "$n" -eq 0 ] || [ "$n" -gt 3 ]; then exit 1; fi
          echo "::warning::retrying $n VS Code scenario(s) once: $(echo $failed)"
          pat=$(printf '%s\n' "$failed" | sed 's/[][\.*^$()+?{}|/]/\\&/g' | paste -sd'|' -)
          rc=0; TUG_E2E_ONLY="^($pat)" xvfb-run -a node test/runTest.mjs 2>&1 | tee e2e-retry.log || rc=$?
          note
          exit $rc

  package:
    name: build + package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json

      - name: Clean install
        run: |
          npm ci
          npm ci --prefix vscode

      - name: Build and pack the CLI
        run: |
          npm run build
          mkdir -p artefacts
          npm pack --pack-destination artefacts

      - name: Package the extension
        run: |
          npm run vscode:package
          mv vscode/*.vsix artefacts/

      - name: Check the .vsix structure
        run: |
          unzip -l artefacts/*.vsix | tee artefacts/vsix-contents.txt
          for f in extension/package.json extension/dist/extension.js extension/media/icon.png extension/LICENSE.txt extension.vsixmanifest; do
            grep -q " $f\$" artefacts/vsix-contents.txt || { echo "::error title=vsix::missing $f"; exit 1; }
          done
          grep -q ' extension/resources/skills/' artefacts/vsix-contents.txt || { echo "::error title=vsix::missing bundled skills"; exit 1; }
          if grep -qE ' extension/(src|node_modules)/' artefacts/vsix-contents.txt; then echo "::error title=vsix::dev files shipped"; exit 1; fi

      - name: Smoke test the packed artefacts
        run: node scripts/smoke-artefacts.mjs --tgz artefacts/tugline-*.tgz --vsix artefacts/*.vsix --require-vsix

      - uses: actions/upload-artifact@v4
        with:
          name: tugline-artefacts
          path: |
            artefacts/*.tgz
            artefacts/*.vsix
          if-no-files-found: error

  smoke:
    name: artefact smoke (${{ matrix.os }}, node ${{ matrix.node }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '24']
    steps:
      # Only the smoke script and the mock endpoint come from the checkout (no install, no build):
      # what is tested is the downloaded artefact.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v4
        with:
          name: tugline-artefacts
          path: artefacts

      - name: Install the tarball and run tug --version / --help / doctor / -p; check the .vsix
        shell: bash
        run: node scripts/smoke-artefacts.mjs --tgz artefacts/tugline-*.tgz --vsix artefacts/*.vsix --require-vsix
